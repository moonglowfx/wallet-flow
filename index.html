<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#09080E" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wallet Flow" />
    <title>Wallet Flow — Liquid Glass Personal Finance</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Fuente no bloqueante: una hoja de estilos externa normal detiene TODO el pintado hasta descargarse (pantalla en blanco). -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"></noscript>
    <style>
      html, body { margin: 0; background: #09080E; }
      @keyframes wf-pulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.06); opacity: 1; }
      }
      @keyframes wf-glow {
        0%, 100% { filter: drop-shadow(0 0 15px rgba(168,85,247,0.4)); }
        50% { filter: drop-shadow(0 0 30px rgba(168,85,247,0.8)); }
      }
    </style>
  </head>
  <body class="bg-[#0F0F13] text-white antialiased selection:bg-purple-500/30 selection:text-purple-200">
    <div id="root">
      <!-- Pantalla de espera instantánea: se pinta con el HTML, antes de descargar el JS (React la reemplaza por una idéntica). -->
      <div style="min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 0 24px; text-align: center; background-color: #09080E; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; user-select: none;">
        <div style="width: 60px; height: 60px; border-radius: 20px; background: linear-gradient(135deg, #9333ea, #c026d3); display: flex; align-items: center; justify-content: center; animation: wf-pulse 1.8s infinite ease-in-out, wf-glow 2.4s infinite ease-in-out; border: 1px solid rgba(255,255,255,0.2);">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1" />
            <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4" />
          </svg>
        </div>
        <div>
          <div style="font-weight: 800; font-size: 17px; letter-spacing: -0.02em; color: #ffffff;">WALLET FLOW</div>
          <div style="margin-top: 6px; font-size: 12px; color: #a1a1aa;">Cargando tu bóveda financiera…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
